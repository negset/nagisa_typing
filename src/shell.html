<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <title>渚タイピング</title>

    <meta name="title" content="渚タイピング" />
    <meta name="description" content="タイピング練習のためのサイト" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      body {
        font-family: arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #222;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }

      /* ロード中メッセージ・オーディオ解除メッセージのエリア */
      #message-container {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;
        pointer-events: none;
      }

      .spinner {
        height: 30px;
        width: 30px;
        margin: 0 auto 10px auto;
        display: inline-block;
        vertical-align: middle;
        -webkit-animation: rotation 0.8s linear infinite;
        -moz-animation: rotation 0.8s linear infinite;
        -o-animation: rotation 0.8s linear infinite;
        animation: rotation 0.8s linear infinite;
        border-left: 5px solid #fff;
        border-right: 5px solid #fff;
        border-bottom: 5px solid #fff;
        border-top: 5px solid red;
        border-radius: 100%;
        background-color: transparent;
      }
      @keyframes rotation {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      #status {
        font-weight: bold;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }

      /* ゲーム画面の中央揃えと800x600のレスポンシブ縮小 */
      .emscripten_border {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
      }

      /* NOTE: Canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten {
        border: 0px none;
        background: #222;
        width: 800px;
        height: 600px;
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
        outline: none;
      }

      #progress {
        display: none;
      }

      #output {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- ロード中および音声インタラクション要求のメッセージ表示領域 -->
    <div id="message-container">
      <div class="spinner" id="spinner"></div>
      <div id="status">Downloading...</div>
    </div>

    <!-- エラー防止用の隠しprogress要素 -->
    <progress value="0" max="100" id="progress" hidden></progress>

    <div class="emscripten_border">
      <canvas
        class="emscripten"
        id="canvas"
        oncontextmenu="event.preventDefault()"
        tabindex="-1"
      ></canvas>
    </div>

    <textarea id="output" rows="8"></textarea>

    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/gh/eligrey/FileSaver.js/dist/FileSaver.min.js"
    ></script>
    <script type="text/javascript">
      function saveFileFromMEMFSToDisk(memoryFSname, localFSname) {
        // This can be called by C/C++ code
        var isSafari = false;
        var data = FS.readFile(memoryFSname);
        var blob;

        if (isSafari)
          blob = new Blob([data.buffer], { type: "application/octet-stream" });
        else
          blob = new Blob([data.buffer], { type: "application/octet-binary" });

        saveAs(blob, localFSname);
      }
    </script>
    <script type="text/javascript">
      var statusElement = document.querySelector("#status");
      var progressElement = document.querySelector("#progress");
      var spinnerElement = document.querySelector("#spinner");
      var messageContainer = document.querySelector("#message-container");

      var isLoaded = false; // ロード完了フラグ

      var Module = {
        preRun: [],
        postRun: [
          function () {
            isLoaded = true;
            // スピナーを隠し、音声インタラクションを促すメッセージに固定
            spinnerElement.style.display = "none";
            statusElement.innerHTML =
              "音声を有効にするには画面をクリックしてください。";

            // ユーザーが一度画面をクリックしたらメッセージを消去
            const removeListener = () => {
              messageContainer.style.display = "none";
              window.removeEventListener("click", removeListener);
            };
            window.addEventListener("click", removeListener);
          },
        ],
        print: (function () {
          var element = document.querySelector("#output");

          if (element) element.value = "";

          return function (text) {
            if (arguments.length > 1)
              text = Array.prototype.slice.call(arguments).join(" ");
            console.log(text);

            if (element) {
              element.value += text + "\n";
              element.scrollTop = element.scrollHeight;
            }
          };
        })(),
        printErr: function (text) {
          if (arguments.length > 1)
            text = Array.prototype.slice.call(arguments).join(" ");
          console.error(text);
        },
        canvas: (function () {
          var canvas = document.querySelector("#canvas");
          canvas.addEventListener(
            "webglcontextlost",
            function (e) {
              alert("WebGL context lost. You will need to reload the page.");
              e.preventDefault();
            },
            false,
          );
          return canvas;
        })(),
        setStatus: function (text) {
          // すでにロードが完了している場合は、後から来る空文字や初期化ステータスで上書きしない
          if (isLoaded) return;

          if (!Module.setStatus.last)
            Module.setStatus.last = { time: Date.now(), text: "" };
          if (text === Module.setStatus.last.text) return;

          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();

          if (m && now - Module.setStatus.last.time < 30) return;

          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;

          if (m) {
            text = m[1];
            if (progressElement) {
              progressElement.value = parseInt(m[2]) * 100;
              progressElement.max = parseInt(m[4]) * 100;
            }
            spinnerElement.hidden = false;
          } else {
            if (progressElement) {
              progressElement.value = null;
              progressElement.max = null;
            }
            if (!text) spinnerElement.style.display = "none";
          }

          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function (left) {
          if (isLoaded) return;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(
            left
              ? "Preparing... (" +
                  (this.totalDependencies - left) +
                  "/" +
                  this.totalDependencies +
                  ")"
              : "All downloads complete.",
          );
        },
      };

      Module.setStatus("Downloading...");

      window.onerror = function () {
        Module.setStatus("Exception thrown, see JavaScript console");
        spinnerElement.style.display = "none";
        Module.setStatus = function (text) {
          if (text) Module.printErr("[post-exception status] " + text);
        };
      };
    </script>

    <!-- 音声コンテキストの自動解除・自動再開用スクリプト -->
    <script type="text/javascript">
      const audioContexList = [];
      (function () {
        self.AudioContext = new Proxy(self.AudioContext, {
          construct(target, args) {
            const result = new target(...args);
            audioContexList.push(result);
            return result;
          },
        });
      })();

      // 画面のどこかがクリックされた時にすべてのサスペンド状態のAudioContextを再開する
      window.addEventListener(
        "pointerdown",
        () => {
          audioContexList.forEach((ctx) => {
            if (ctx.state == "suspended") {
              ctx.resume();
            }
          });
        },
        { once: true },
      );
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
