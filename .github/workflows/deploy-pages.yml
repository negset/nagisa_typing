name: Build web and deploy contents to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NAME: ${{ github.event.repository.name }}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        run: |
          curl -fL https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$GITHUB_WORKSPACE/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"

      - name: Build web
        run: |
          zig build -Dtarget=wasm32-emscripten --release=small
          mkdir web
          mv "zig-out/web/${NAME}.html" "web/index.html"
          mv "zig-out/web/${NAME}.js" "web/"
          mv "zig-out/web/${NAME}.wasm" "web/"
          mv "zig-out/web/${NAME}.data" "web/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "web"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
